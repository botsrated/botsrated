name: Publish PyPI package (Trusted Publishing)

# Manual only (workflow_dispatch); nothing runs on push, tag or schedule. Dry run (build + checks only) is the
# default. Publishes one package from integrations/ to PyPI with Trusted Publishing (OIDC): no PyPI token is stored
# in this repo or its secrets. PEP 740 attestations are uploaded by gh-action-pypi-publish.
#
# Before the first real run (repo owner):
# 1. GitHub -> Settings -> Environments -> "pypi-publish": add Anton as a required reviewer, allow only the main branch.
# 2. pypi.org -> project -> Publishing -> add a trusted publisher (GitHub):
#      owner: botsrated   repository: botsrated   workflow: publish-pypi.yml   environment: pypi-publish
# 3. Then remove any API tokens for the project.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory under integrations/"
        required: true
        type: choice
        options: [python-core, langchain, llamaindex, microsoft-agent-framework]
      dry_run:
        description: "Only build and check, don't upload"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.package }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install --upgrade pip
          pip install pytest respx pytest-asyncio langchain-tests build twine
          pip install -e "../python-core[x402]" -e .
          python -m pytest -q -m "not live" tests
      - name: Build sdist and wheel
        run: rm -rf dist && python -m build && twine check --strict dist/*
      - name: Version not yet on PyPI
        run: |
          name=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "$name==$ver"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$ver/json")
          if [ "$code" = "200" ]; then echo "::error::$name $ver is already on PyPI; bump the version first"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: integrations/${{ inputs.package }}/dist/
          if-no-files-found: error

  publish:
    name: Upload ${{ inputs.package }} to PyPI
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: pypi-publish   # required reviewer configured on the environment
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
