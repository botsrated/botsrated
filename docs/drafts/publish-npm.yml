name: Publish npm package (trusted publishing)

# Manual only: workflow_dispatch from refs/heads/main. Any other event or ref fails in the first job. Nothing runs on
# push, tag or schedule. Dry run is the default. Publishes one package from integrations/ to npm with OIDC trusted
# publishing and --provenance: no npm token is stored in this repo or its secrets.
#
# Release gate (no signed tags needed; works from the GitHub iPhone app):
#   1. Someone with write access dispatches this workflow on main with the package and its version.
#   2. gate checks: event and ref, the version input equals package.json's version at the run's commit, the tag
#      <name>-v<version> doesn't exist yet and the version isn't on npm yet. Every later job checks out exactly that
#      commit (github.sha, the main commit the run started on), never a branch name.
#   3. review writes "What you are approving" to the run's Summary page: package@version, the commit, a compare link
#      and commit list since the commit of the last version published on npm (its gitHead or provenance commit, not
#      the newest tag; tags whose version isn't on npm are flagged), and the sha256 of the tarball to be published.
#   4. A real publish waits in the "npm-publish" environment until a required reviewer (the org owner) approves it. GitHub
#      checks 2FA when that reviewer signs in, not on each approval, and an approval made through the API with a token needs
#      no 2FA at all, so this gate is only as strong as who can sign in as, or hold a token for, a reviewer
#      account. Dry runs don't use the environment and need no approval.
#   5. After a successful (non-dry-run) publish, the tag job creates the annotated tag <name>-v<version> on that
#      commit with the GITHUB_TOKEN. It fails if the tag already exists. Only that job has contents: write.
# The optional signed-tag check (integrations/release-tools/verify-tag.sh and test-verify-tag.sh) stays in the repo
# and isn't used here.
#
# Jobs (least privilege):
#   gate    - the checks above (contents: read; GITHUB_TOKEN used read-only to look the tag up).
#   test    - npm ci (with install scripts), typecheck and tests, then packs a reference .tgz. Nothing it builds is
#             published.
#   pack    - the tarball that is published: a fresh checkout, npm ci --ignore-scripts (no dependency install
#             script runs), dist/ built by calling the pinned TypeScript compiler directly, npm pack --ignore-scripts.
#   compare - the pack .tgz must be byte-identical (sha256) to the test job's reference .tgz, so a dependency that
#             changed the build output in either job stops the release.
#   review  - the approval summary (no credentials, no checkout).
#   dry-run - dry runs only: npm publish --dry-run on the pack .tgz, without the environment, id-token or
#             --provenance.
#   publish - real publishes only, in the reviewer-gated "npm-publish" environment with id-token: write; downloads
#             the pack .tgz, checks its sha256 against the approval summary and runs npm publish on it. No checkout,
#             no npm ci, no project scripts.
#   tag     - after a real publish only: creates the release tag (contents: write, no checkout, no id-token).
# Only publish has id-token. Every npm job installs the npm CLI only from a tarball whose sha512 matches
# NPM_CLI_INTEGRITY below (same value as the registry's dist.integrity for that version).
#
# Before the first real run (repo owner): see docs/drafts/README.md ("Production publish (OIDC only)" and "Setup (once)").
# Production publishes use this workflow's OIDC trusted publishing only. Do not run npm publish from a shared machine.
# Publish order: x402-client first, then vercel-ai-sdk (it depends on @botsrated/x402-preflight from npm).
# Provenance note: npm provenance names this workflow run on main and its commit (the same commit the tag gets).

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory under integrations/"
        required: true
        type: choice
        options: [x402-client, vercel-ai-sdk]
      version:
        description: "Version to release; must equal package.json's version on main, e.g. 0.2.1"
        required: true
        type: string
      dry_run:
        description: "Only run npm publish --dry-run"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  NPM_CLI_VERSION: "12.2.1"   # trusted publishing needs >= 11.5.1
  NPM_CLI_INTEGRITY: "sha512-bKCmFRVT/BB+YPEYbZwQ1XUI3N5t4xKSpU1MxOjo7z3iWzKBJ0ZXRC1xFdEN+TC7N5TdywaBzf2dMXGJq/e2PQ=="

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate (main, version ${{ inputs.version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      tag: ${{ steps.check.outputs.tag }}
      compare_url: ${{ steps.changes.outputs.compare_url }}
      commits: ${{ steps.changes.outputs.commits }}
    steps:
      - name: Only workflow_dispatch from refs/heads/main
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ] || [ "$REF" != "refs/heads/main" ]; then
            echo "::error::releases run only by workflow_dispatch from refs/heads/main (got $EVENT on $REF)"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0     # full history and tags for the compare link and commit list
          fetch-tags: true
          persist-credentials: false
      - id: check
        env:
          PKG: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}   # read-only here (contents: read): looks the tag up
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "::error::'$VERSION' is not a version like 1.2.3"; exit 1; fi
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checkout is not the run's commit $SHA"; exit 1; }
          cd "integrations/$PKG"
          name=$(node -p "require('./package.json').name"); ver=$(node -p "require('./package.json').version")
          if [ "$ver" != "$VERSION" ]; then echo "::error::version input $VERSION does not match package.json ($ver) at $SHA"; exit 1; fi
          tag="${name#@botsrated/}-v$ver"
          if gh api "repos/$REPO/git/matching-refs/tags/$tag" --jq '.[].ref' | grep -qxF "refs/tags/$tag"; then
            echo "::error::tag $tag already exists; bump the version first"; exit 1
          fi
          if npm view "$name@$ver" version >/dev/null 2>&1; then echo "::error::$name@$ver is already published; bump the version first"; exit 1; fi
          { echo "sha=$SHA"; echo "tag=$tag"; echo "prefix=${name#@botsrated/}"; echo "name=$name"; } >> "$GITHUB_OUTPUT"
          echo "Releasing $name@$ver from main at $SHA; tag after publish: $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Changes since the last release (for the approver)
        id: changes
        env:
          PREFIX: ${{ steps.check.outputs.prefix }}
          NAME: ${{ steps.check.outputs.name }}
          PKG: ${{ inputs.package }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: bash integrations/release-tools/release-summary.sh "$PREFIX" "$SHA" "integrations/$PKG" "$REPO" "$SERVER" npm "$NAME" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test ${{ inputs.package }} ${{ inputs.version }}
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read   # no id-token here
    defaults:
      run:
        working-directory: integrations/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false   # no caches in release builds
      - name: Pinned npm CLI (checksum-verified tarball)
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/npm-cli.tgz" "https://registry.npmjs.org/npm/-/npm-$NPM_CLI_VERSION.tgz"
          got="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/npm-cli.tgz" | base64 -w0)"
          if [ "$got" != "$NPM_CLI_INTEGRITY" ]; then echo "::error::npm CLI tarball checksum mismatch"; exit 1; fi
          npm install -g --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/npm-cli.tgz"
          test "$(npm --version)" = "$NPM_CLI_VERSION"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test   # builds dist/ first (pretest) and runs the C1 no-resend tests against it
      - name: Reference tarball (not published; compared with the pack job's)
        run: |
          mkdir -p ../../ref && npm pack --ignore-scripts --pack-destination ../../ref
          sha256sum ../../ref/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball-reference
          path: ref/*.tgz
          if-no-files-found: error

  pack:
    name: Pack ${{ inputs.package }} ${{ inputs.version }} (no install scripts)
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read   # no id-token here
    outputs:
      sha256: ${{ steps.packed.outputs.sha256 }}
    defaults:
      run:
        working-directory: integrations/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Pinned npm CLI (checksum-verified tarball)
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/npm-cli.tgz" "https://registry.npmjs.org/npm/-/npm-$NPM_CLI_VERSION.tgz"
          got="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/npm-cli.tgz" | base64 -w0)"
          if [ "$got" != "$NPM_CLI_INTEGRITY" ]; then echo "::error::npm CLI tarball checksum mismatch"; exit 1; fi
          npm install -g --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/npm-cli.tgz"
          test "$(npm --version)" = "$NPM_CLI_VERSION"
      - name: npm ci --ignore-scripts (no dependency install scripts run)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build dist/ with the lockfile's TypeScript compiler (no npm scripts)
        run: |
          rm -rf dist
          node node_modules/typescript/bin/tsc -p tsconfig.json
      - name: Version not yet on npm
        run: |
          name=$(node -p "require('./package.json').name"); ver=$(node -p "require('./package.json').version")
          echo "$name@$ver"
          if npm view "$name@$ver" version >/dev/null 2>&1; then echo "::error::$name@$ver is already published; bump the version first"; exit 1; fi
      - name: npm pack --ignore-scripts (dist/ was built above; prepack does not run)
        id: packed
        run: |
          mkdir -p ../../pack && npm pack --ignore-scripts --pack-destination ../../pack
          ls -l ../../pack && sha256sum ../../pack/*.tgz | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(find ../../pack -name '*.tgz' | wc -l)" = 1 ] || { echo "::error::expected exactly one tarball"; exit 1; }
          echo "sha256=$(cd ../../pack && sha256sum -- *.tgz)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: pack/*.tgz
          if-no-files-found: error

  compare:
    name: Tarballs from the test and pack jobs are identical
    needs: [test, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: pack/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball-reference
          path: ref/
      - run: |
          a=$(cd pack && sha256sum -- *.tgz); b=$(cd ref && sha256sum -- *.tgz)
          echo "pack: $a"; echo "test: $b"
          if [ "$a" != "$b" ]; then echo "::error::the published tarball differs from the tested build"; exit 1; fi

  review:
    name: What you are approving (${{ inputs.package }} ${{ inputs.version }})
    needs: [gate, test, pack, compare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Approval summary
        env:
          PKG: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          SHA: ${{ needs.gate.outputs.sha }}
          TAG: ${{ needs.gate.outputs.tag }}
          COMPARE_URL: ${{ needs.gate.outputs.compare_url }}
          COMMITS: ${{ needs.gate.outputs.commits }}
          TARBALL_SHA256: ${{ needs.pack.outputs.sha256 }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          {
            echo "## What you are approving"
            echo
            if [ "$DRY_RUN" = "true" ]; then echo "**Dry run: nothing is published and no approval is needed.**"; else echo "**Real publish to npm**, then tag \`$TAG\`."; fi
            echo
            echo "- Package: \`integrations/$PKG\` version \`$VERSION\`"
            echo "- Commit (main): [\`$SHA\`]($SERVER/$REPO/commit/$SHA)"
            echo "- Started by: \`$TRIGGERING_ACTOR\` (actor \`$ACTOR\`)"
            echo "- Changes since the last release: $COMPARE_URL ($COMMITS commits; the list is in the gate job's summary)"
            echo "- Tarball sha256 (byte-identical to the tested build): \`$TARBALL_SHA256\`"
            echo
            echo "Approve only if the commit is the merge you expect and the changes are what you meant to release."
          } >> "$GITHUB_STEP_SUMMARY"

  dry-run:
    name: npm publish --dry-run ${{ inputs.package }} (no approval, no id-token)
    needs: [gate, review]
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read   # no environment and no id-token: a dry run never waits for approval
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: pack/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pinned npm CLI (checksum-verified tarball)
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/npm-cli.tgz" "https://registry.npmjs.org/npm/-/npm-$NPM_CLI_VERSION.tgz"
          got="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/npm-cli.tgz" | base64 -w0)"
          if [ "$got" != "$NPM_CLI_INTEGRITY" ]; then echo "::error::npm CLI tarball checksum mismatch"; exit 1; fi
          npm install -g --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/npm-cli.tgz"
          test "$(npm --version)" = "$NPM_CLI_VERSION"
      - name: npm publish --dry-run (no --provenance; nothing is uploaded)
        run: npm publish ./pack/*.tgz --dry-run --access public --ignore-scripts

  publish:
    name: Publish ${{ inputs.package }} ${{ inputs.version }} to npm
    needs: [gate, pack, review]
    if: ${{ !inputs.dry_run && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: npm-publish   # required reviewer configured on the environment; real publishes only
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing and provenance; only this job has it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: pack/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pinned npm CLI (checksum-verified tarball)
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/npm-cli.tgz" "https://registry.npmjs.org/npm/-/npm-$NPM_CLI_VERSION.tgz"
          got="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/npm-cli.tgz" | base64 -w0)"
          if [ "$got" != "$NPM_CLI_INTEGRITY" ]; then echo "::error::npm CLI tarball checksum mismatch"; exit 1; fi
          npm install -g --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/npm-cli.tgz"
          test "$(npm --version)" = "$NPM_CLI_VERSION"
      - name: Tarball is the one in the approval summary
        env:
          TARBALL_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          got=$(cd pack && sha256sum -- *.tgz)
          if [ "$got" != "$TARBALL_SHA256" ]; then echo "::error::tarball differs from the approval summary ($got)"; exit 1; fi
      - name: npm publish
        run: npm publish ./pack/*.tgz --provenance --access public --ignore-scripts

  tag:
    name: Create release tag ${{ needs.gate.outputs.tag }}
    needs: [gate, publish]
    if: ${{ !inputs.dry_run && needs.publish.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job: creates the tag object and ref through the API (no checkout)
    steps:
      - name: Create annotated tag on the published commit (fails if it exists)
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$REPO/git/matching-refs/tags/$TAG" --jq '.[].ref' | grep -qxF "refs/tags/$TAG"; then
            echo "::error::tag $TAG already exists"; exit 1
          fi
          obj=$(gh api "repos/$REPO/git/tags" -f tag="$TAG" -f object="$SHA" -f type=commit \
                -f message="$TAG: published to npm by $RUN_URL" --jq .sha)
          # Creating a ref that already exists returns 422, so a race cannot move an existing tag.
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$obj" --jq .ref
          echo "Tagged $TAG -> $SHA" >> "$GITHUB_STEP_SUMMARY"
