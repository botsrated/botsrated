# Fragment for the private Pages worker. This file is not a deployable project
# and must not be published with `wrangler deploy` or `wrangler pages deploy`.
# The live worker config is not in this public repo (Pages tip f61ad18b is an
# ad-hoc deploy). Lead copies the var below into that private wrangler.toml.
# Default off. Only the exact string "true" enables the org ledger.

[vars]
FEATURE_ORG_LEDGER = "false"
