name: CI

# Offline tests only: every HTTP call is mocked (respx / fetch stubs). No secrets, no network calls to
# botsrated.com, no payments. Live tests (pytest -m live, haystack/strands smoke scripts) are not run here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install packages from this checkout
        run: |
          python -m pip install --upgrade pip
          pip install pytest respx pytest-asyncio langchain-tests ruff
          pip install -e "integrations/python-core[x402]" -e integrations/langchain -e integrations/llamaindex -e integrations/microsoft-agent-framework -e integrations/openai-agents -e integrations/langgraph -e integrations/google-adk -e integrations/crewai -e integrations/llama-stack -e integrations/pydantic-ai
          if python -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'; then pip install -e "integrations/pydantic-ai[hooks]"; fi
      - name: Lint (ruff check)
        run: |
          for d in python-core langchain llamaindex microsoft-agent-framework openai-agents langgraph google-adk crewai llama-stack pydantic-ai; do (cd integrations/$d && ruff check .); done
      - name: botsrated (python-core)
        working-directory: integrations/python-core
        run: python -m pytest -q -m "not live" tests
      - name: langchain-botsrated
        working-directory: integrations/langchain
        run: python -m pytest -q -m "not live" tests
      - name: langgraph-botsrated
        working-directory: integrations/langgraph
        run: python -m pytest -q -m "not live" tests
      - name: google-adk-botsrated
        working-directory: integrations/google-adk
        run: python -m pytest -q -m "not live" tests
      - name: crewai-botsrated
        working-directory: integrations/crewai
        run: python -m pytest -q -m "not live" tests
      - name: llama-stack-botsrated
        working-directory: integrations/llama-stack
        run: python -m pytest -q -m "not live" tests
      - name: pydantic-ai-botsrated
        working-directory: integrations/pydantic-ai
        run: python -m pytest -q -m "not live" tests
      - name: llama-index-tools-botsrated
        working-directory: integrations/llamaindex
        run: python -m pytest -q -m "not live" tests
      - name: agent-framework-botsrated
        working-directory: integrations/microsoft-agent-framework
        run: python -m pytest -q -m "not live" tests
      - name: botsrated-openai-agents
        working-directory: integrations/openai-agents
        run: python -m pytest -q -m "not live" tests

  node:
    name: Node ${{ matrix.node }} (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
        package: ["x402-client", "vercel-ai-sdk", "mastra"]
        exclude:
          # @mastra/core engines.node is >=22.13.0
          - node: "20"
            package: "mastra"
    defaults:
      run:
        working-directory: integrations/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: integrations/${{ matrix.package }}/package-lock.json
      - name: npm ci
        run: |
          set -euo pipefail
          if [ "${{ matrix.package }}" = "x402-client" ]; then
            npm ci
          else
            # Wedges require @botsrated/x402-preflight ^0.3.0. That version is not on npm
            # until this release is published. `npm pack --prefix` packs the cwd package,
            # so build the tarball from integrations/x402-client itself, install that file,
            # then restore the ^0.3.0 spec. package.json on the branch stays ^0.3.0.
            core="$GITHUB_WORKSPACE/integrations/x402-client"
            tarball="$RUNNER_TEMP/botsrated-x402-preflight-0.3.0.tgz"
            (
              cd "$core"
              npm ci
              npm pack --pack-destination "$RUNNER_TEMP"
            )
            test -f "$tarball"
            cp package.json "$RUNNER_TEMP/package.json.wedge"
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              if (pkg.dependencies["@botsrated/x402-preflight"] !== "^0.3.0") {
                console.error("expected ^0.3.0, got", pkg.dependencies["@botsrated/x402-preflight"]);
                process.exit(1);
              }
              pkg.dependencies["@botsrated/x402-preflight"] = "file:" + process.argv[1];
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            ' "$tarball"
            npm install --no-audit --no-fund
            cp "$RUNNER_TEMP/package.json.wedge" package.json
            node -e '
              const installed = require("./node_modules/@botsrated/x402-preflight/package.json");
              if (installed.version !== "0.3.0") {
                console.error("installed", installed.version);
                process.exit(1);
              }
            '
          fi
      - run: npm run typecheck
      - run: npm test

  spec:
    name: Receipt spec verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check spec/verify.mjs
