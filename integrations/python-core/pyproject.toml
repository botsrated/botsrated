[project]
name = "botsrated"
version = "0.1.6"
description = "Pre-payment check for x402 agents: free BotsRated preflight before paying a seller; paid lookups opt-in with a budget."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["x402", "botsrated", "agents", "payments", "preflight", "base", "usdc"]

[project.optional-dependencies]
x402 = ["x402[httpx,evm]>=2.25"]

[project.urls]
Homepage = "https://botsrated.com"
Repository = "https://github.com/botsrated/botsrated"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botsrated"]
