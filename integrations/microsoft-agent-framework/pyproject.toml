[project]
name = "agent-framework-botsrated"
version = "0.1.0"
description = "BotsRated pre-payment check for Microsoft Agent Framework: function middleware that checks an x402 payTo with the free BotsRated preflight before a payment tool runs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["agent-framework-core>=1.22,<2", "botsrated>=0.1.2,<0.2"]
keywords = ["agent-framework", "microsoft-agent-framework", "middleware", "x402", "botsrated", "payments", "base", "usdc"]

[project.optional-dependencies]
mcp = ["mcp>=1.24,<3", "tenacity>=9.1.4,<10"]

[project.urls]
Homepage = "https://botsrated.com"
Repository = "https://github.com/botsrated/botsrated"
Documentation = "https://github.com/botsrated/botsrated/blob/main/integrations/microsoft-agent-framework/README.md"
Issues = "https://github.com/botsrated/botsrated/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_framework_botsrated"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls the real, free BotsRated API (no payment)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["botsrated", "botsrated.*"]
ignore_missing_imports = true
