[project]
name = "botsrated-openai-agents"
version = "0.1.0"
description = "Payment-client hook that pairs with the OpenAI Agents SDK. Registers BotsRated PaymentGuard on an x402 client before pay. Not an orchestration runtime."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["botsrated>=0.3.1,<0.4"]
keywords = ["openai-agents", "openai", "x402", "botsrated", "payment-guard", "preflight"]

[project.urls]
Homepage = "https://botsrated.com"
Repository = "https://github.com/botsrated/botsrated"
Documentation = "https://github.com/botsrated/botsrated/blob/main/integrations/openai-agents/README.md"
Issues = "https://github.com/botsrated/botsrated/issues"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "x402>=2.25,<3"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botsrated_openai_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real, free BotsRated API (no payment)"]
