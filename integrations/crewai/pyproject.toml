[project]
name = "crewai-botsrated"
version = "0.1.0"
description = "Payment-client wrap that pairs with CrewAI. Registers BotsRated PaymentGuard on an x402 client and offers an optional before-pay tool hook. Not a crew runtime."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["botsrated>=0.2.1,<0.3"]
keywords = ["crewai", "x402", "botsrated", "payment-guard", "preflight"]

[project.urls]
Homepage = "https://botsrated.com"
Repository = "https://github.com/botsrated/botsrated"
Documentation = "https://github.com/botsrated/botsrated/blob/main/integrations/crewai/README.md"
Issues = "https://github.com/botsrated/botsrated/issues"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "x402>=2.25,<3"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_botsrated"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: calls the real, free BotsRated API (no payment)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
