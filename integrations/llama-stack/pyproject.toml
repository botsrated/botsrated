[project]
name = "llama-stack-botsrated"
version = "0.1.0"
description = "Payment-client wrap that pairs with Llama Stack. Registers BotsRated PaymentGuard on an x402 client. Not a runtime, distribution, or inference server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["botsrated>=0.3.0,<0.4"]
keywords = ["llama-stack", "x402", "botsrated", "payment-guard", "preflight"]

[project.urls]
Homepage = "https://botsrated.com"
Repository = "https://github.com/botsrated/botsrated"
Documentation = "https://github.com/botsrated/botsrated/blob/main/integrations/llama-stack/README.md"
Issues = "https://github.com/botsrated/botsrated/issues"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "x402>=2.25,<3"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_stack_botsrated"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = ["live: calls the real, free BotsRated API (no payment)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
