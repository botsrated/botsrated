[project]
name = "langchain-botsrated"
version = "0.1.0"
description = "LangChain tools for BotsRated: free pre-payment preflight of x402 sellers, opt-in budgeted paid checks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["langchain-core>=0.3", "botsrated>=0.1.0"]

[project.urls]
Homepage = "https://botsrated.com"
Repository = "https://github.com/botsrated/botsrated"

[dependency-groups]
test = ["pytest>=8", "respx>=0.21", "langchain-tests>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langchain_botsrated"]
